services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contemplart}
      POSTGRES_USER: ${POSTGRES_USER:-contemplart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contemplart}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
